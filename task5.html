<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h1>Weekly Routine</h1>
<table border="1">
    <tr>
        <th>Time</th>
        <th>Sunday</th>
        <th>Monday</th>
        <th>Tuesday</th>
        <th>Wednesday</th>
        <th>Thursday</th>
        <th>Friday</th>
        <th>Saturday</th>
    </tr>

    <tr>
        <td>7:00 - 9:00 AM</td>
        <td></td>
        <td></td>
        <td>Library</td>
        <td></td>
        <td></td>
        <td></td>
        <td rowspan="3">No Class</td>
    </tr>

    <tr>
        <td>10:00 AM - 12:00 PM</td>
        <td>Software</td>
        <td>Software</td>
        <td></td>
        <td>Software</td>
        <td>Software</td>
        <td>Software</td>
    </tr>

    <tr>
        <td>1:00 - 3:00 PM</td>
        <td>Web</td>
        <td>Web</td>
        <td></td>
        <td>Web</td>
        <td>Web</td>
        <td>Web</td>
        <td></td>
    </tr>
</table>

</body>
</html>
